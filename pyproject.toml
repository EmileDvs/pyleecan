[project]
name = "pyleecan"
version = "1.5.2"
description = "Python Library for Electrical Engineering Computational Analysis"
readme = "README.md"
authors = [
    { name = "Pyleecan Developers", email = "pyleecan@framalistes.org"}
]
requires-python = ">=3.14"
dependencies = [
    "black>=24.0.0,<25.0.0",
    "cloudpickle>=1.3",
    "dacite>=1.9.2",
    "ezdxf>=1.4.4",
    "h5py>=3.2.1",
    "imageio>=2.38.1",
    "matplotlib>=3.10.7",
    "numpy>=2",
    "openpyxl>=3.1.5",
    "pandas>=1.0.3",
    "pyfemm>=0.1.3",
    "pyside6>=6.12.0",
    "scipy>=1.6.0",
    "sympy>=1.14.0",
    "xlrd>=1.2.0",
]

[project.scripts]
pyleecan = "pyleecan:main"

[project.urls]
Repository = "https://github.com/Eomys/pyleecan"
Issues = "https://github.com/Eomys/pyleecan/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "hypothesis>=6.170.0",
    "mock>=4.0.2",
    "pytest>=5.4.1",
    "pytest-qt>=3.3.0",
    "ruff>=0.17.1",
    "setuptools>=84.0.0",
    "ty>=0.0.88",
]
mesh = [
    "gmsh>=4.15.2",
    "meshio>=5",
    "pyuff>=2.4",
    "pyvista>=0.49.1",
]
notebook = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "ipython>=9.17.1",
    "nbconvert>=7.17.2",
    "pyvista[jupyter]>=0.49.1",
]
omp = [
    "scikit-learn>=1.9.1",
]
optimization = [
    "deap>=1.3.1",
    "pymoo>=0.6.2",
    "smt>=2.15.0",
]
